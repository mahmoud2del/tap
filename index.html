<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/lib.js"></script>
</head>
<body>
<div class="login-wrap"><form class="login-card" id="f" autocomplete="on">
  <img id="lg" alt="">
  <h1 id="org"></h1><p class="s">قاعدة بيانات الأعمال الفنية — تسجيل الدخول</p>
  <div id="m"></div>
  <div class="f"><label for="em">البريد الإلكتروني</label><input id="em" type="email" required autocomplete="username" dir="ltr"></div>
  <div class="f"><label for="pw">كلمة المرور</label><input id="pw" type="password" required autocomplete="current-password" dir="ltr"></div>
  <button class="btn gold" id="go">دخول</button>
</form></div>
<script>
(async()=>{
  const $=id=>document.getElementById(id), m=$('m');
  $('lg').src=L.CFG.LOGO_URL||'assets/logo.svg'; $('org').textContent=L.CFG.ORG_NAME||'';
  const show=(t,c)=>{m.className='msg '+c;m.textContent=t};
  if(!L.configured){show('لم يتم ضبط ملف js/config.js بعد (رابط Supabase والمفتاح).','warn');$('go').disabled=true;return}
  if(new URLSearchParams(location.search).get('e')==='noaccess') show('هذا الحساب غير مفعّل أو لا يملك صلاحية دخول.','err');
  const {data:{session}}=await L.sb.auth.getSession();
  if(session&&!location.search.includes('e=')) location.replace('app.html');
  $('f').onsubmit=async e=>{
    e.preventDefault(); $('go').disabled=true; m.className=''; m.textContent='';
    const {error}=await L.sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
    if(error){show('بيانات الدخول غير صحيحة.','err');$('go').disabled=false;return}
    location.replace('app.html');
  };
})();
</script>
</body></html>
